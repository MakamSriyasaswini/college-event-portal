
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-portal
  labels:
    app: college-event-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: college-event-portal
  template:
    metadata:
      labels:
        app: college-event-portal
    spec:
      containers:
        - name: event-portal
          image: makamsriya/college-event-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-portal-service
spec:
  type: NodePort
  selector:
    app: college-event-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30015
